name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Generate gradle-wrapper.jar
        run: |
          # Ubuntu runners have Gradle pre-installed
          # Use gradle wrapper command to generate gradle-wrapper.jar
          gradle wrapper --gradle-version 8.7
          ls -la gradle/wrapper/
          JAR_SIZE=$(wc -c < gradle/wrapper/gradle-wrapper.jar)
          echo "gradle-wrapper.jar size: $JAR_SIZE bytes"
          if [ "$JAR_SIZE" -lt 5000 ]; then
            echo "ERROR: gradle-wrapper.jar too small ($JAR_SIZE bytes)"
            exit 1
          fi
          # Copy to android location
          mkdir -p android/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          ls -la android/gradle/wrapper/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

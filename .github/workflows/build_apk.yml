name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Download Gradle distribution
        run: |
          # Download Gradle distribution to extract gradle-wrapper.jar
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -L -o gradle.zip
          unzip -q gradle.zip
          cp gradle-8.7/lib/gradle-wrapper-8.7.jar android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          find gradle-8.7 -name "gradle-wrapper*.jar" -exec cp {} android/gradle/wrapper/gradle-wrapper.jar \; -quit
          ls -la android/gradle/wrapper/
          rm -rf gradle.zip gradle-8.7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Set up Gradle 8.9
        run: |
          curl -fsSL -o gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip || curl -fsSL -o gradle-8.9-bin.zip https://github.com/gradle/gradle/releases/download/v8.9/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "GRADLE_BIN=$PWD/gradle-8.9/bin/gradle" >> "$GITHUB_ENV"
          echo "GRADLE_ZIP=$PWD/gradle-8.9-bin.zip" >> "$GITHUB_ENV"

      - name: Generate gradle wrapper (use local Gradle 8.9)
        run: |
          cd android
          "$GRADLE_BIN" wrapper --gradle-version 8.9
          ls -la gradlew gradlew.bat gradle/wrapper/
          test -s gradle/wrapper/gradle-wrapper.jar || { echo "ERROR: jar missing"; exit 1; }
          sed -i "s#^distributionUrl=.*#distributionUrl=file://$GRADLE_ZIP#" gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish to GitHub Release (stable link)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI 相亲助手 APK (latest)
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
